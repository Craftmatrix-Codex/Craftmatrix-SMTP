services:
  go-smtp:
    build: https://github.com/Craftmatrix-Codex/Go-Smtp.git#main
    restart: unless-stopped
    environment:
      HTTP_ADDR: :8080
      SMTP_HOSTNAME: ${SMTP_HOSTNAME:?set SMTP_HOSTNAME}
      SMTP_ADDR: :587
      SMTP_TLS_CERT_FILE: ${SMTP_TLS_CERT_FILE:-}
      SMTP_TLS_KEY_FILE: ${SMTP_TLS_KEY_FILE:-}
      SMTP_AUTH_USERNAME: ${SMTP_AUTH_USERNAME:?set SMTP_AUTH_USERNAME}
      SMTP_AUTH_PASSWORD: ${SMTP_AUTH_PASSWORD:?set SMTP_AUTH_PASSWORD}
      SMTP_QUEUE_DIR: /var/lib/go-smtp/queue
      SMTP_RELAY_HOST: ${SMTP_RELAY_HOST:-}
      SMTP_RELAY_PORT: ${SMTP_RELAY_PORT:-587}
      SMTP_RELAY_USERNAME: ${SMTP_RELAY_USERNAME:-}
      SMTP_RELAY_PASSWORD: ${SMTP_RELAY_PASSWORD:-}
      DKIM_SELECTOR: ${DKIM_SELECTOR:-mail}
    ports:
      - "${HTTP_PORT:-8080}:8080"
      - "${SMTP_PORT:-587}:587"
    volumes:
      - smtp_queue:/var/lib/go-smtp/queue

volumes:
  smtp_queue:
