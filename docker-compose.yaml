services:
  go-smtp:
    build: .
    restart: unless-stopped
    # Coolify's named volume is mounted root-owned; the queue needs write access.
    user: "0:0"
    environment:
      HTTP_ADDR: :8080
      SMTP_HOSTNAME: ${SMTP_HOSTNAME:?set SMTP_HOSTNAME}
      SMTP_ADDR: :587
      SMTP_TLS_CERT_FILE: ${SMTP_TLS_CERT_FILE:-}
      SMTP_TLS_KEY_FILE: ${SMTP_TLS_KEY_FILE:-}
      SMTP_TLS_CERT_BASE64: ${SMTP_TLS_CERT_BASE64:-}
      SMTP_TLS_KEY_BASE64: ${SMTP_TLS_KEY_BASE64:-}
      SMTP_AUTH_USERNAME: ${SMTP_AUTH_USERNAME:?set SMTP_AUTH_USERNAME}
      SMTP_AUTH_PASSWORD: ${SMTP_AUTH_PASSWORD:?set SMTP_AUTH_PASSWORD}
      SMTP_QUEUE_DIR: /tmp/go-smtp/queue
      SMTP_RELAY_HOST: ${SMTP_RELAY_HOST:-}
      SMTP_RELAY_PORT: ${SMTP_RELAY_PORT:-587}
      SMTP_RELAY_USERNAME: ${SMTP_RELAY_USERNAME:-}
      SMTP_RELAY_PASSWORD: ${SMTP_RELAY_PASSWORD:-}
      DKIM_SELECTOR: ${DKIM_SELECTOR:-mail}
    expose:
      - "8080"
    ports:
      - "${SMTP_PORT:-587}:587"
    volumes:
      - smtp_queue:/tmp/go-smtp/queue
    healthcheck:
      test: ["CMD", "/go-smtp", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  smtp_queue:
